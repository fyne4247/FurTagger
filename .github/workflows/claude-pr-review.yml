# Automatic Claude review on every pull request.
# Claude reads each new or updated PR and leaves review comments on the lines
# that need changes (or one summary comment if nothing does).
# It skips draft PRs until they're marked "Ready for review".
#
# Needs one secret: CLAUDE_CODE_OAUTH_TOKEN (made with `claude setup-token`).
# Each review uses your Claude plan's usage.
# Docs: https://code.claude.com/docs/en/github-actions

name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
